spring:
  config:
    activate:
      on-profile: test

  datasource:
    # Modern Spring Boot 4 + Testcontainers often uses @ServiceConnection
    # But if using manual config, this driver is correct for the jdbc:tc protocol
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    url: "jdbc:tc:postgresql:18:///test_db"

  flyway:
    clean-disabled: false             # Allow clean for integration tests

security:
  jwt:
    secret-key: "TEST_SECRET_KEY_MUST_BE_LONG_ENOUGH_FOR_HMAC_SHA_256"
    access-token-expiration: 5000       # 5 seconds (Fast expiry tests)
    refresh-token-expiration: 60000     # 1 minute