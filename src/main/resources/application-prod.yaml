spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # In Prod, these come from Environment Variables (K8s Secrets / AWS Secrets Manager)
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}

    # HIKARI CONNECTION POOLING (Critical for High Concurrency)
    hikari:
      pool-name: TicketLedgerHiPool
      maximum-pool-size: 20           # Tuned for standard 4-8 vCPU DB
      minimum-idle: 10                # Keep warm connections ready
      connection-timeout: 20000       # 20s timeout (Fail fast under load)
      idle-timeout: 300000            # 5m
      max-lifetime: 1200000           # 20m (Refresh connections to avoid stale network issues)

  jpa:
    show-sql: false                   # ABSOLUTELY NO logging SQL in Prod (PII + Perf)
    properties:
      hibernate:
        jdbc:
          batch_size: 50              # Group inserts (great for bulk booking creation)
          order_inserts: true
          order_updates: true
        generate_statistics: false    # Disable overhead unless diagnosing

logging:
  level:
    root: INFO
    com.ticketledger: INFO
    # Silence Hibernate chatter in prod
    org.hibernate: WARN

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY}            # Must be set in Environment Variables
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}   # Default 15 minutes
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000} # Default 7 days